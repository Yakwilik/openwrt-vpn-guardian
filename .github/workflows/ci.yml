name: CI

on:
  push:
    branches: ["main", "master"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.23.12"
          cache: true
      - run: go test ./...

  cross-build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - goarch: amd64
            suffix: amd64
          - goarch: "386"
            suffix: "386"
          - goarch: arm
            goarm: "7"
            suffix: armv7
          - goarch: arm64
            suffix: arm64
          - goarch: loong64
            suffix: loong64
          - goarch: riscv64
            suffix: riscv64
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.23.12"
          cache: true
      - name: Build static Linux binary
        shell: bash
        run: |
          set -euo pipefail
          export CGO_ENABLED=0
          export GOOS=linux
          export GOARCH="${{ matrix.goarch }}"
          if [ -n "${{ matrix.goarm || '' }}" ]; then
            export GOARM="${{ matrix.goarm }}"
          fi
          out="/tmp/vpn-guardian-${{ matrix.suffix }}"
          go build -trimpath -o "$out" ./cmd/vpn-guardian
          file "$out"
          file "$out" | grep -q "statically linked"
