            const list = () => github.paginate(github.rest.actions.listArtifactsForRepo, { ...context.repo, per_page: 100 });
            const before = await list();
            const byId = new Map(before.map(a => [a.id, a]));
            for (const item of expected) {
              const artifact = byId.get(item.id);
              if (!artifact) continue;
              for (const key of ['name', 'size_in_bytes', 'created_at']) {
                if (artifact[key] !== item[key]) throw new Error(`Metadata mismatch for ${item.id}: ${key}`);
              }
            }
            let deleted = 0;
            let removedBytes = 0;
            for (const item of expected) {
              if (!byId.has(item.id)) continue;
              try {
                await github.rest.actions.deleteArtifact({ ...context.repo, artifact_id: item.id });
                deleted++;
                removedBytes += item.size_in_bytes;
                core.info(`Deleted confirmed artifact ${item.id} (${item.name})`);
              } catch (error) {
                if (error.status !== 404) throw error;
                core.info(`Artifact ${item.id} already absent`);
              }
            }
            const after = await list();
            const expectedIds = new Set(expected.map(a => a.id));
            const remaining = after.filter(a => expectedIds.has(a.id));
            if (remaining.length) throw new Error(`Approved artifacts remain: ${remaining.map(a => a.id)}`);
            const result = { expected: expected.length, deleted, alreadyAbsent: expected.length - deleted, removedBytes, approvedArtifactsRemaining: remaining.length, otherArtifactsKept: after.length };
            core.info(JSON.stringify(result));
            await core.summary.addHeading('Approved artifact cleanup').addCodeBlock(JSON.stringify(result, null, 2), 'json').write();
