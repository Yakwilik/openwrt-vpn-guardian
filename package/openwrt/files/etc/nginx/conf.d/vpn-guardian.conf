server {
    listen 80;
    listen [::]:80;
    server_name vpn.home.arpa;

    root /www/vpn-dashboard;
    index index.html;
    access_log off;

    location = /api/status {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /www/cgi-bin/vpn-status;
        fastcgi_param SCRIPT_NAME /cgi-bin/vpn-status;
        fastcgi_pass unix:/var/run/fcgiwrap.socket;
        add_header Cache-Control "no-store" always;
    }

    location = /api/history {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /www/cgi-bin/vpn-history;
        fastcgi_param SCRIPT_NAME /cgi-bin/vpn-history;
        fastcgi_pass unix:/var/run/fcgiwrap.socket;
        add_header Cache-Control "no-store" always;
    }

    location = /api/control {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /www/cgi-bin/vpn-control;
        fastcgi_param SCRIPT_NAME /cgi-bin/vpn-control;
        fastcgi_pass unix:/var/run/fcgiwrap.socket;
        add_header Cache-Control "no-store" always;
    }

    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-store" always;
    }
}
